<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Terracotta to Deep Clay -->
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26A45" />
      <stop offset="45%" stop-color="#C45D3C" />
      <stop offset="100%" stop-color="#8F3216" />
    </linearGradient>

    <!-- Coin / Gold Accent Gradient -->
    <linearGradient id="dbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="40%" stop-color="#F7D08A" />
      <stop offset="100%" stop-color="#D6963E" />
    </linearGradient>

    <!-- Beam & Pans Gradient (Lustrous Warm Ivory) -->
    <linearGradient id="dbIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF1E6" />
    </linearGradient>

    <!-- Subtle Ambient Drop Shadow -->
    <filter id="dbShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#461405" flood-opacity="0.38" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D0B02" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#dbBg)" filter="url(#dbShadow)" />
  <!-- Glass/Bevel Inner Rim -->
  <rect x="30" y="30" width="452" height="452" rx="114" fill="none" stroke="#FFAE94" stroke-width="4.5" stroke-opacity="0.55" />

  <!-- Center Decorative Glow Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#dbGold)" stroke-width="3" opacity="0.25" stroke-dasharray="10 8" />

  <!-- Graphic Elements -->
  <g filter="url(#glow)">
    <!-- Central Pedestal / Base -->
    <path d="M 176 400 L 336 400" stroke="url(#dbIvory)" stroke-width="20" stroke-linecap="round" />
    <path d="M 216 418 L 296 418" stroke="url(#dbGold)" stroke-width="12" stroke-linecap="round" opacity="0.9" />

    <!-- Vertical Pillar -->
    <line x1="256" y1="126" x2="256" y2="400" stroke="url(#dbIvory)" stroke-width="18" stroke-linecap="round" />

    <!-- Top Pivot Ring -->
    <circle cx="256" cy="126" r="20" fill="url(#dbGold)" stroke="url(#dbIvory)" stroke-width="7" />

    <!-- Dynamic Balance Beam (Subtly curved & poised) -->
    <path d="M 112 186 Q 256 160 400 186" fill="none" stroke="url(#dbIvory)" stroke-width="16" stroke-linecap="round" />
    <circle cx="256" cy="173" r="11" fill="url(#dbGold)" />

    <!-- Left Chains & Pan -->
    <circle cx="112" cy="186" r="9" fill="url(#dbGold)" />
    <line x1="112" y1="186" x2="68" y2="292" stroke="url(#dbIvory)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="112" y1="186" x2="156" y2="292" stroke="url(#dbIvory)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.9" />
    <!-- Left Dish Pan -->
    <path d="M 54 292 C 54 336 170 336 170 292 Z" fill="url(#dbGold)" stroke="url(#dbIvory)" stroke-width="6" />
    <!-- Floating coin in left pan -->
    <ellipse cx="112" cy="286" rx="28" ry="12" fill="#FFFFFF" opacity="0.95" />

    <!-- Right Chains & Pan -->
    <circle cx="400" cy="186" r="9" fill="url(#dbGold)" />
    <line x1="400" y1="186" x2="356" y2="292" stroke="url(#dbIvory)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="400" y1="186" x2="444" y2="292" stroke="url(#dbIvory)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.9" />
    <!-- Right Dish Pan -->
    <path d="M 342 292 C 342 336 458 336 458 292 Z" fill="url(#dbGold)" stroke="url(#dbIvory)" stroke-width="6" />
    <!-- Floating coin in right pan -->
    <ellipse cx="400" cy="286" rx="28" ry="12" fill="#FFFFFF" opacity="0.95" />

    <!-- Central Emblem: Glowing Rupee Currency Coin -->
    <circle cx="256" cy="268" r="46" fill="url(#dbGold)" stroke="url(#dbIvory)" stroke-width="6" />
    <circle cx="256" cy="268" r="38" fill="none" stroke="#8F3216" stroke-width="2" opacity="0.3" stroke-dasharray="4 3" />
    <text x="256" y="285" font-family="'Manrope', 'Segoe UI', sans-serif" font-weight="900" font-size="46" text-anchor="middle" fill="#6A220D">₹</text>
  </g>
</svg>